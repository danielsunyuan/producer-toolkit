name: Aubio Integration Tests

on:
  push:
    branches: [ main, feature/aubio-audio-analysis ]
  pull_request:
    branches: [ main ]

jobs:
  test-aubio-integration:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.9, '3.10', 3.11]
        exclude:
          # Reduce matrix size for faster CI
          - os: windows-latest
            python-version: 3.9
          - os: windows-latest
            python-version: 3.11

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    # Install system dependencies for aubio
    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libaubio-dev libaubio5 aubio-tools
        sudo apt-get install -y libfftw3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev
        sudo apt-get install -y pkg-config
    
    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install aubio
        brew install ffmpeg
        brew install pkg-config
    
    - name: Install system dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        # For Windows, we'll rely on pip to install aubio
        choco install ffmpeg
    
    # Install Python dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wheel setuptools
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    # Install the package in development mode
    - name: Install package
      run: |
        pip install -e .
    
    # Run aubio-specific tests
    - name: Test aubio integration
      run: |
        pytest tests/test_audio_analyzer.py -v --tb=short
        pytest tests/test_aubio_integration.py -v --tb=short
    
    # Run existing tests to ensure no regression
    - name: Test existing functionality
      run: |
        python -m tests.run_tests --offline
    
    # Test CLI with aubio features
    - name: Test CLI with aubio features
      run: |
        pt --help | grep -q "no-analysis" || (echo "CLI help should show --no-analysis option" && exit 1)

  test-aubio-real-audio:
    runs-on: ubuntu-latest
    needs: test-aubio-integration
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libaubio-dev libaubio5 aubio-tools
        sudo apt-get install -y libfftw3-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev
        sudo apt-get install -y pkg-config
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
    
    # Test with real audio files from test resources
    - name: Test with real audio files
      run: |
        # Use the test audio files in the resources directory
        python -c "
        from producer_toolkit.analyzer.audio_analyzer import analyze_audio
        import os
        
        test_files = ['tests/resources/sample.wav']
        for test_file in test_files:
            if os.path.exists(test_file):
                try:
                    bpm, key = analyze_audio(test_file)
                    print(f'✅ {test_file}: {bmp} BPM, Key: {key}')
                    assert isinstance(bpm, float) and bpm > 0
                    assert isinstance(key, str) and len(key) > 0
                except Exception as e:
                    print(f'❌ {test_file}: {e}')
                    raise
            else:
                print(f'⚠️ Test file not found: {test_file}')
        print('✅ Real audio analysis tests passed')
        "

  test-performance:
    runs-on: ubuntu-latest
    needs: test-aubio-integration
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libaubio-dev libaubio5
        sudo apt-get install -y pkg-config
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        pip install time-machine  # For performance testing
    
    - name: Test performance
      run: |
        python -c "
        import time
        import tempfile
        import numpy as np
        import soundfile as sf
        from producer_toolkit.analyzer.audio_analyzer import analyze_audio
        
        # Create a test audio file
        with tempfile.NamedTemporaryFile(suffix='.wav', delete=False) as f:
            sample_rate = 44100
            duration = 10.0  # 10 second test file
            t = np.linspace(0, duration, int(sample_rate * duration), False)
            audio_data = 0.5 * np.sin(2 * np.pi * 440 * t)  # 440Hz sine wave
            sf.write(f.name, audio_data, sample_rate)
            
            # Time the analysis
            start_time = time.time()
            bpm, key = analyze_audio(f.name)
            end_time = time.time()
            
            analysis_time = end_time - start_time
            print(f'Analysis completed in {analysis_time:.2f} seconds')
            print(f'Result: {bpm} BPM, Key: {key}')
            
            # Performance should be reasonable (< 30 seconds for 10s audio)
            assert analysis_time < 30, f'Analysis took too long: {analysis_time}s'
            
            import os
            os.unlink(f.name)
        
        print('✅ Performance tests passed')
        "

  test-compatibility:
    runs-on: ubuntu-latest
    needs: test-aubio-integration
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libaubio-dev libaubio5
        sudo apt-get install -y pkg-config
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
    
    - name: Test backward compatibility
      run: |
        python -c "
        # Test that old API still works without breaking
        from producer_toolkit.downloader.download import download_audio
        from producer_toolkit.processor.spleeter_processor import extract_stems
        
        # These should work without specifying the new analyze_features parameter
        print('✅ Import successful')
        
        # Test function signatures accept old calls
        try:
            # This should work (we're not actually calling it, just checking signature)
            import inspect
            
            # Check download_audio can be called without analyze_features
            sig = inspect.signature(download_audio)
            params = list(sig.parameters.keys())
            analyze_param = sig.parameters.get('analyze_features')
            assert analyze_param is not None, 'analyze_features parameter missing'
            assert analyze_param.default == True, 'analyze_features should default to True'
            
            # Check extract_stems can be called without analyze_features  
            sig = inspect.signature(extract_stems)
            analyze_param = sig.parameters.get('analyze_features')
            assert analyze_param is not None, 'analyze_features parameter missing'
            assert analyze_param.default == True, 'analyze_features should default to True'
            
            print('✅ Backward compatibility maintained')
            
        except Exception as e:
            print(f'❌ Backward compatibility issue: {e}')
            raise
        "
