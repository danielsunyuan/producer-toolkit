name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11"]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y ffmpeg
        elif [ "$RUNNER_OS" == "macOS" ]; then
          brew install ffmpeg || true
        fi

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r requirements.txt

    - name: Verify CLI command
      run: |
        ptk --help

    - name: Run unit tests
      run: |
        python -m unittest discover tests/ -v -k "test_audio_analyzer"

    - name: Run integration tests (local files only)
      env:
        SKIP_YOUTUBE_TESTS: true
      run: |
        python -m unittest tests.test_integration.TestLocalAudioFile -v

    - name: Test runner script
      run: |
        python -m tests.run_tests

