name: Test Installation and Basic Functionality

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual triggering

defaults:
  run:
    shell: bash

jobs:
  test-installation:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install package dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Run unit tests
        run: |
          python -m unittest tests.test_safe_workflow tests.test_audio_analyzer -v
      
      - name: Test package installation
        run: |
          # Test that the ptk command is available
          ptk --help
          
          # Test that we can import the package
          python -c "from producer_toolkit import downloader, processor; print('Package import successful')"
      
      - name: Verify project structure
        run: |
          # Verify main package structure
          ls -la producer_toolkit/
          ls -la producer_toolkit/analyzer/
          ls -la producer_toolkit/downloader/
          ls -la producer_toolkit/processor/
          ls -la producer_toolkit/utils/
