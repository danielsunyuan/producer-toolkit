name: Package verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      model_smoke:
        description: Run opt-in real CPU inference on generated audio
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lock: linux-amd64-py311.txt
          - os: macos-15
            lock: macos-arm64-py311.txt
          - os: windows-latest
            lock: windows-amd64-py311.txt
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Create isolated environment
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = Windows ]; then
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r "requirements/${{ matrix.lock }}"
      - name: Build and install wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python tools/check_wheel.py dist
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -m pip check
      - name: Test installed package outside checkout
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python tests/run_offline.py --installed
          else
            python tests/run_offline.py --installed
          fi
      - name: Optional real model smoke
        if: github.event_name == 'workflow_dispatch' && inputs.model_smoke
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tools/smoke_inference.py"
      - name: Record dependency licence metadata
        run: python tools/license_inventory.py license-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-package-${{ matrix.os }}
          path: |
            dist/*.whl
            license-inventory.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history with Gitleaks
        shell: bash
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.29.0/gitleaks_8.29.0_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '39e07ad810336fd0ae80d0bd61c60d0521f628173e7583583b5df4a38738522c  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact=100 --no-banner --log-opts=--all .
