name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint

    - name: Run flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check imports
      run: |
        python -c "import producer_toolkit; print('✅ Package imports successfully')"
        python -c "from producer_toolkit.cli import main; print('✅ CLI imports successfully')"
        python -c "from producer_toolkit.analyzer.audio_analyzer import AudioAnalyzer; print('✅ Analyzer imports successfully')"
        python -c "from producer_toolkit.downloader.download import download_audio; print('✅ Downloader imports successfully')"
        python -c "from producer_toolkit.processor.demucs_processor import extract_stems; print('✅ Demucs processor imports successfully')"

