[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "producer-toolkit"
dynamic = ["version"]
description = "A command-line toolkit for music producers to download audio/video from YouTube and extract stems using Demucs"
authors = [
    {name = "Daniel", email = "danielsunyuan@gmail.com"},
]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers", 
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio",
]
keywords = ["audio", "music", "youtube", "demucs", "stems", "separation", "download"]

dependencies = [
    "yt-dlp[default]>=2026.10.26",
    "demucs>=4.0.0",
    "ffmpeg-python==0.2.0",
    "librosa>=0.10.0",
    "soundfile==0.12.1",
    "pydub==0.25.1",
    "numpy>=1.22.4",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchcodec>=0.8.0",
]

[project.scripts]
ptk = "producer_toolkit.cli:main"
ptk-gui = "producer_toolkit.desktop:main"
u = "producer_toolkit.cli:main"
pt = "producer_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/danielsunyuan/producer-toolkit"
Repository = "https://github.com/danielsunyuan/producer-toolkit"
Issues = "https://github.com/danielsunyuan/producer-toolkit/issues"

[tool.setuptools.dynamic]
version = {attr = "producer_toolkit.__version__"}

[tool.setuptools.packages.find]
include = ["producer_toolkit*"]
